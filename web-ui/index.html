<!DOCTYPE html>

<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name=description content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="src/app.css">
    <script type="text/javascript" src="src/js/axios.js"></script>
    <script type="text/javascript" src="src/js/vue.js"></script>
    <title>Amazon Rekognition Video Analyzer</title>
</head>

<body>
    <div id="app">

    <!-- ============ LOADING (auth state unknown) ============ -->
    <div v-if="authenticated === null" class="login-wrap">
      <div class="login-card">로딩 중...</div>
    </div>

    <!-- ============ LOGIN VIEW (unauthenticated) ============ -->
    <div v-else-if="!authenticated" class="login-wrap">
      <div class="login-card">
        <h2>로그인</h2>
        <form v-on:submit.prevent="login">
          <input class="login-input" type="text" v-model="username" placeholder="아이디" autocomplete="username" autofocus>
          <input class="login-input" type="password" v-model="password" placeholder="비밀번호" autocomplete="current-password">
          <button class="login-btn" type="submit" v-bind:disabled="loggingIn">{{ loggingIn ? "확인 중..." : "로그인" }}</button>
        </form>
        <div v-if="loginError" class="login-error">{{ loginError }}</div>
      </div>
    </div>

    <!-- ============ MAIN VIEW (authenticated) ============ -->
    <template v-else>
    <div class="header">
        <h1><img class="logo" src="logo.png" alt="Logo">Amazon Rekognition Video Analyzer</h1>
        <button class="logout-btn" v-on:click="logout">로그아웃 ({{ user }})</button>
    </div>

    <div class="outer-grid">
      <div class="inner-grid-list">
        <div v-if="configError" class="config-note">프레임 조회 설정을 불러오지 못했어요 ({{ configError }}). 촬영 기능은 사용할 수 있어요.</div>
        <span v-if="enrichedframes && enrichedframes.length">
          <div v-for="frame of enrichedframes" class="inner-grid">
              <div class="container-img">
                <img v-if="frame.s3_presigned_url && !frame.image_load_error"
                     class="frame-image"
                     v-bind:src="frame.s3_presigned_url"
                     alt="Video Frame Here"
                     v-on:error="onImageError(frame)" />
                <div v-else-if="frame.image_load_error" class="image-error">이미지 로드 실패: Network에서 S3 요청 상태코드를 확인하세요</div>
                <div v-else class="image-error">이미지 URL 없음</div>
              </div>
              <div class="container">
                <div>
                  <span>{{new Date(frame.processed_timestamp * 1000).toString()}}</span>
                  <br/>
                  <span v-if="frame.rekog_labels && frame.rekog_labels.length">
                      <ul class="rekog-label-list">
                          <b>Detected objects</b>
                          <li class="rekog-label" v-for="label of frame.rekog_labels">
                              {{label.Name}} ({{(Math.round((label.Confidence + 0.00001) * 100) / 100) + "%"}}) <b>{{label.OnWatchList? "On Watch List -- ALERT!" : ""}}</b>
                          </li>
                      </ul>
                  </span>
                  <span v-else-if="frame.labels_disabled" class="rekog-label-list">
                      <b>Detected objects</b>
                      <div class="rekog-label">(라벨 감지 비활성화됨)</div>
                  </span>
                </div>
              </div>
          </div>
        </span>
      </div>
      <div>
        <h2>Settings</h2>

        <!-- ============ 촬영하기 (browser webcam capture) ============ -->
        <div class="load capture-panel">
            <h2>촬영하기</h2>
            <video ref="video" class="capture-video" autoplay playsinline muted></video>

            <div class="capture-config">
              <label>frameInterval
                <input type="number" min="1" step="1" v-model.number="frameInterval" class="threshold-input">
              </label>
              <label>durationSeconds
                <input type="number" min="1" step="1" v-model.number="durationSeconds" class="threshold-input">
              </label>
            </div>

            <div>
              <button class="compare-btn" v-on:click="startCapture" v-bind:disabled="captureState === 'capturing'">촬영 시작</button>
              <button class="stop-btn" v-on:click="stopCapture" v-bind:disabled="captureState !== 'capturing'">촬영 중지</button>
            </div>

            <div class="capture-status">
              <div>상태: <b v-bind:class="'cap-' + captureState">{{ captureStateLabel }}</b></div>
              <div>전송 성공: <b>{{ sentCount }}</b> / 실패: <b>{{ failedCount }}</b></div>
              <div v-if="captureState === 'capturing'">남은 시간: <b>{{ remainingSeconds }}</b>s</div>
              <div v-if="lastSentAt">마지막 전송: {{ lastSentAt }}</div>
              <div v-if="lastError" class="capture-error">마지막 에러: {{ lastError }}</div>
            </div>
        </div>

        <div class="load">
            <div>Autoload</div>
            <div>
              <label class="switch">
                <input type="checkbox" v-on:click="toggleFetchFrames" :checked="autoload">
                <div class="slider round"></div>
              </label>
            </div>
        </div>

        <div class="load face-compare">
            <h2>얼굴 비교</h2>
            <div>기준 얼굴 이미지 업로드 (JPG/PNG, 최대 4MB)</div>
            <div>
              <input type="file" accept="image/jpeg,image/png" v-on:change="handleFileSelect">
            </div>
            <div v-if="uploadedImageDataUrl">
              <img class="face-preview" v-bind:src="uploadedImageDataUrl" alt="Selected face">
            </div>
            <div>
              <label>유사도 임계값(%)
                <input type="number" min="0" max="100" step="1" v-model.number="similarityThreshold" class="threshold-input">
              </label>
            </div>
            <div>
              <button class="compare-btn" v-on:click="compareFace" v-bind:disabled="!uploadedImageBase64 || isComparingFace">
                최근 프레임과 얼굴 비교
              </button>
            </div>

            <div v-if="isComparingFace" class="fc-loading">비교 중...</div>

            <div v-if="faceCompareResult" class="fc-result">
              <div v-if="faceCompareResult.success">
                <div class="fc-verdict" v-bind:class="faceCompareResult.matched ? 'fc-pass' : 'fc-fail'">
                  {{ faceCompareResult.matched ? "✔ 일치 (threshold 통과)" : "✘ 불일치 (threshold 미달)" }}
                </div>
                <div>유사도: <b>{{ faceCompareResult.similarity }}%</b> (임계값 {{ faceCompareResult.threshold }}%)</div>
                <div v-if="faceCompareResult.target">최신 프레임 key: <span class="fc-mono">{{ faceCompareResult.target.frame_s3_key }}</span></div>
                <div v-if="faceCompareResult.target">프레임 시각: {{ frameTime(faceCompareResult.target) }}</div>
                <div v-if="faceCompareResult.age_seconds != null">프레임 나이: {{ faceCompareResult.age_seconds }}s</div>
              </div>
              <div v-else class="fc-fail">
                비교 실패: {{ reasonText(faceCompareResult.reason) }}
              </div>
            </div>

            <div v-if="faceCompareError" class="fc-error">오류: {{ faceCompareError }}</div>
        </div>
      </div>
    </div>
    </template>
</div>

  <script type="text/javascript" src="src/app.js"></script>
</body>

</html>
