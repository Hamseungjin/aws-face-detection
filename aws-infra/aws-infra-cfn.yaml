AWSTemplateFormatVersion: 2010-09-09

Description: >
  Kiosk-only data stack. Creates the Rekognition Collection used by STORE/RETRIEVE.
  No S3 frames bucket, Kinesis, DynamoDB, Lambda, or API Gateway.

Parameters:

  KioskFaceCollectionIdParameter:
    Type: String
    Default: "kiosk-face-collection"
    MinLength: "1"
    MaxLength: "255"
    Description: "Rekognition collection id for kiosk FaceId references."

Resources:

  KioskFaceCollection:
    Type: AWS::Rekognition::Collection
    Properties:
      CollectionId: !Ref KioskFaceCollectionIdParameter

Outputs:

  KioskFaceCollectionId:
    Description: "Rekognition collection id for kiosk FaceId references."
    Value: !Ref KioskFaceCollection
