AWSTemplateFormatVersion: 2010-09-09

# EC2 Application stack for amazon-rekognition-video-analyzer (GREENFIELD).
#
# Stack name (typical): video-analyzer-ec2-stack
# Creates EXACTLY ONE ApplicationInstance -- no WebUiInstance / KpiInstance.
#
# SEPARATE from the data pipeline stack (video-analyzer-stack) so it can be created
# and deleted without touching Kinesis / Lambda / DynamoDB / S3 / API Gateway.
#
# Architecture:
#   Browser -> HTTPS:443 -> Nginx
#                         - / /kiosk /api /src /healthz -> FastAPI 127.0.0.1:8080
#                         - /dashboard/                  -> KPI     127.0.0.1:8000
#
# SQLite:
#   /data/kiosk/kiosk.db
#   dedicated encrypted EBS
#
# Demo notes:
#   - default VPC public subnet
#   - NO NAT gateway
#   - NO VPC endpoints
#   - NO ALB / ACM domain
#   - one Elastic IP
#   - admin via SSM Session Manager
#   - no SSH ingress
#   - self-signed TLS at Nginx
#   - IAM RoleName omitted so CloudFormation generates unique names

Description: >
  Greenfield Application-only EC2 stack with one host running Nginx,
  FastAPI, kiosk UI, operator UI, and KPI dashboard with dedicated SQLite EBS.

Parameters:

  VpcIdParameter:
    Type: AWS::EC2::VPC::Id
    Description: "VPC id."

  SubnetIdParameter:
    Type: AWS::EC2::Subnet::Id
    Description: "Public subnet id in the selected VPC."

  ImageIdParameter:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
    Description: "Amazon Linux 2023 x86_64 AMI."

  ApplicationInstanceTypeParameter:
    Type: String
    Default: "t3.small"
    Description: "Application EC2 instance type."

  AllowedIngressCidrParameter:
    Type: String
    Default: "0.0.0.0/0"
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$"
    Description: >
      CIDR allowed to reach HTTPS port 443 and HTTP port 80.
      SSH is not opened.

  RootVolumeSizeGbParameter:
    Type: Number
    Default: 8
    Description: "Root EBS gp3 volume size."

  ApplicationDataVolumeSizeGbParameter:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 64
    Description: "Dedicated encrypted gp3 EBS volume for SQLite."

  ApplicationFastApiPortParameter:
    Type: Number
    Default: 8080
    Description: "Loopback FastAPI port."

  ApplicationKpiPortParameter:
    Type: Number
    Default: 8000
    Description: "Loopback KPI dashboard port."

  AppArtifactS3BucketParameter:
    Type: String
    MinLength: "1"
    Description: "S3 bucket containing application artifacts."

  AppArtifactS3KeyPrefixParameter:
    Type: String
    Default: "apps/"
    Description: "S3 key prefix containing application artifacts."

  FaceCollectionIdParameter:
    Type: String
    Default: "kiosk-face-collection"
    Description: "Rekognition collection id from the data stack KioskFaceCollection output."

  WebUiAuthSsmPrefixParameter:
    Type: String
    Default: "/video-analyzer/webui"
    Description: "SSM prefix containing web login parameters."

  EnableSchedulerParameter:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Enable or disable automatic demo start and stop schedules.

Conditions:

  SchedulerEnabled: !Equals
    - !Ref EnableSchedulerParameter
    - "true"

Resources:

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:

      # IMPORTANT:
      # EC2 security group descriptions accept a restricted character set.
      # Keep this value ASCII-only.
      GroupDescription: "Application HTTPS and HTTP ingress"

      VpcId: !Ref VpcIdParameter

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidrParameter
          Description: "HTTPS Nginx application entry"

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedIngressCidrParameter
          Description: "HTTP to HTTPS redirect"

      Tags:
        - Key: Name
          Value: video-analyzer-app-sg


  ApplicationInstanceRole:
    Type: AWS::IAM::Role
    Properties:

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:

          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:

        - PolicyName: application-artifact-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${AppArtifactS3BucketParameter}/${AppArtifactS3KeyPrefixParameter}webui/*"
                  - !Sub "arn:aws:s3:::${AppArtifactS3BucketParameter}/${AppArtifactS3KeyPrefixParameter}kpi/*"
                  - !Sub "arn:aws:s3:::${AppArtifactS3BucketParameter}/${AppArtifactS3KeyPrefixParameter}application/*"


        - PolicyName: application-auth-ssm-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WebUiAuthSsmPrefixParameter}/*"

              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService:
                      !Sub "ssm.${AWS::Region}.amazonaws.com"


        - PolicyName: application-rekognition-compare
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - rekognition:CompareFaces
                Resource: "*"
                # CompareFaces does not support resource-level IAM.


        - PolicyName: application-rekognition-collection
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - rekognition:IndexFaces
                  - rekognition:SearchFacesByImage
                  - rekognition:DeleteFaces
                  - rekognition:DescribeCollection
                Resource:
                  !Sub "arn:aws:rekognition:${AWS::Region}:${AWS::AccountId}:collection/${FaceCollectionIdParameter}"


        - PolicyName: application-kpi-metrics-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                Resource: "*"

      Tags:
        - Key: Name
          Value: video-analyzer-app-role


  ApplicationInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ApplicationInstanceRole


  ApplicationInstance:
    Type: AWS::EC2::Instance
    Properties:

      ImageId: !Ref ImageIdParameter
      InstanceType: !Ref ApplicationInstanceTypeParameter
      IamInstanceProfile: !Ref ApplicationInstanceProfile

      NetworkInterfaces:

        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetIdParameter
          GroupSet:
            - !Ref ApplicationSecurityGroup

      BlockDeviceMappings:

        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGbParameter
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true

      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash

            set -x

            exec > /var/log/userdata.log 2>&1

            echo "application userdata start"

            if ! command -v aws >/dev/null 2>&1; then
              echo "aws CLI not found"
              dnf install -y awscli-2 || dnf install -y awscli || true
            fi

            if ! command -v aws >/dev/null 2>&1; then

              echo "installing AWS CLI v2"

              curl -sSL \
                https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
                -o /tmp/awscliv2.zip

              command -v unzip >/dev/null 2>&1 || dnf install -y unzip

              unzip -q /tmp/awscliv2.zip -d /tmp

              /tmp/aws/install

            fi

            if ! command -v aws >/dev/null 2>&1; then
              echo "ERROR aws CLI unavailable"
              exit 1
            fi

            mkdir -p /opt/app

            if aws s3 cp \
              "s3://${AppArtifactS3BucketParameter}/${AppArtifactS3KeyPrefixParameter}application/bootstrap.sh" \
              /opt/app/bootstrap.sh
            then

              chmod +x /opt/app/bootstrap.sh

              ARTIFACT_BUCKET="${AppArtifactS3BucketParameter}" \
              ARTIFACT_PREFIX="${AppArtifactS3KeyPrefixParameter}" \
              WEBUI_AUTH_SSM_PREFIX="${WebUiAuthSsmPrefixParameter}" \
              DATA_VOLUME_DEVICE="/dev/xvdf" \
              WEBUI_PORT="${ApplicationFastApiPortParameter}" \
              KPI_PORT="${ApplicationKpiPortParameter}" \
              KIOSK_DB_PATH="/data/kiosk/kiosk.db" \
              REKOGNITION_FACE_COLLECTION_ID="${FaceCollectionIdParameter}" \
              /opt/app/bootstrap.sh

            else

              echo "application bootstrap not found"

            fi

      Tags:
        - Key: Name
          Value: video-analyzer-app


  ApplicationDataVolume:
    Type: AWS::EC2::Volume

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      AvailabilityZone:
        !GetAtt ApplicationInstance.AvailabilityZone

      Size:
        !Ref ApplicationDataVolumeSizeGbParameter

      VolumeType: gp3

      Encrypted: true

      Tags:

        - Key: Name
          Value: video-analyzer-app-data

        - Key: Purpose
          Value: kiosk-sqlite


  ApplicationDataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment

    Properties:

      Device: /dev/xvdf

      InstanceId:
        !Ref ApplicationInstance

      VolumeId:
        !Ref ApplicationDataVolume


  ApplicationElasticIp:
    Type: AWS::EC2::EIP

    Properties:

      Domain: vpc

      Tags:

        - Key: Name
          Value: video-analyzer-app-eip


  ApplicationElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation

    Properties:

      AllocationId:
        !GetAtt ApplicationElasticIp.AllocationId

      InstanceId:
        !Ref ApplicationInstance


  SchedulerRole:
    Type: AWS::IAM::Role
    Condition: SchedulerEnabled

    Properties:

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - scheduler.amazonaws.com

            Action:
              - sts:AssumeRole

            Condition:

              StringEquals:

                aws:SourceAccount:
                  !Ref "AWS::AccountId"

                aws:SourceArn:
                  !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default"

      Policies:

        - PolicyName: ec2-start-stop-application

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              - Effect: Allow

                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances

                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ApplicationInstance}"

      Tags:

        - Key: Name
          Value: video-analyzer-app-scheduler-role


  ScheduleStartMorning:
    Type: AWS::Scheduler::Schedule
    Condition: SchedulerEnabled

    Properties:

      Name: video-analyzer-ec2-start-0900

      Description: "Start ApplicationInstance Mon-Fri 09:00 Asia Seoul"

      FlexibleTimeWindow:
        Mode: "OFF"

      ScheduleExpression:
        "cron(0 9 ? * MON-FRI *)"

      ScheduleExpressionTimezone:
        "Asia/Seoul"

      State:
        ENABLED

      Target:

        Arn:
          "arn:aws:scheduler:::aws-sdk:ec2:startInstances"

        RoleArn:
          !GetAtt SchedulerRole.Arn

        Input:
          !Sub '{"InstanceIds":["${ApplicationInstance}"]}'


  ScheduleStopMorning:
    Type: AWS::Scheduler::Schedule
    Condition: SchedulerEnabled

    Properties:

      Name: video-analyzer-ec2-stop-1100

      Description: "Stop ApplicationInstance Mon-Fri 11:00 Asia Seoul"

      FlexibleTimeWindow:
        Mode: "OFF"

      ScheduleExpression:
        "cron(0 11 ? * MON-FRI *)"

      ScheduleExpressionTimezone:
        "Asia/Seoul"

      State:
        ENABLED

      Target:

        Arn:
          "arn:aws:scheduler:::aws-sdk:ec2:stopInstances"

        RoleArn:
          !GetAtt SchedulerRole.Arn

        Input:
          !Sub '{"InstanceIds":["${ApplicationInstance}"]}'


  ScheduleStartAfternoon:
    Type: AWS::Scheduler::Schedule
    Condition: SchedulerEnabled

    Properties:

      Name: video-analyzer-ec2-start-1300

      Description: "Start ApplicationInstance Mon-Fri 13:00 Asia Seoul"

      FlexibleTimeWindow:
        Mode: "OFF"

      ScheduleExpression:
        "cron(0 13 ? * MON-FRI *)"

      ScheduleExpressionTimezone:
        "Asia/Seoul"

      State:
        ENABLED

      Target:

        Arn:
          "arn:aws:scheduler:::aws-sdk:ec2:startInstances"

        RoleArn:
          !GetAtt SchedulerRole.Arn

        Input:
          !Sub '{"InstanceIds":["${ApplicationInstance}"]}'


  ScheduleStopAfternoon:
    Type: AWS::Scheduler::Schedule
    Condition: SchedulerEnabled

    Properties:

      Name: video-analyzer-ec2-stop-1500

      Description: "Stop ApplicationInstance Mon-Fri 15:00 Asia Seoul"

      FlexibleTimeWindow:
        Mode: "OFF"

      ScheduleExpression:
        "cron(0 15 ? * MON-FRI *)"

      ScheduleExpressionTimezone:
        "Asia/Seoul"

      State:
        ENABLED

      Target:

        Arn:
          "arn:aws:scheduler:::aws-sdk:ec2:stopInstances"

        RoleArn:
          !GetAtt SchedulerRole.Arn

        Input:
          !Sub '{"InstanceIds":["${ApplicationInstance}"]}'


Outputs:

  ApplicationInstanceId:
    Description: "Application EC2 instance id."
    Value:
      !Ref ApplicationInstance


  ApplicationElasticIp:
    Description: "Application Elastic IP."
    Value:
      !Ref ApplicationElasticIp


  ApplicationUrl:
    Description: "Application HTTPS URL."
    Value:
      !Sub "https://${ApplicationElasticIp}/"


  ApplicationDashboardUrl:
    Description: "Application KPI dashboard URL."
    Value:
      !Sub "https://${ApplicationElasticIp}/dashboard/"


  ApplicationDataVolumeId:
    Description: "Dedicated SQLite EBS volume id."
    Value:
      !Ref ApplicationDataVolume


  StopInstancesCommand:
    Description: "Manual ApplicationInstance stop command."
    Value:
      !Sub "aws ec2 stop-instances --instance-ids ${ApplicationInstance}"


  ScheduleSummary:
    Description: "Scheduler configuration."

    Value:
      !If
        - SchedulerEnabled
        - "MON-FRI KST 09 start 11 stop 13 start 15 stop"
        - "Scheduler disabled"


  ArchitectureNote:
    Description: "Application architecture."

    Value: >
      Application-only stack with one EC2 instance, one Elastic IP,
      and one dedicated SQLite EBS volume.