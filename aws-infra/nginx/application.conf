# ApplicationInstance reverse proxy (demo / hackathon).
# TLS is terminated here. Upstream FastAPI and KPI bind loopback only.
#
# Routes:
#   /              → FastAPI 127.0.0.1:8080  (operator UI)
#   /kiosk         → FastAPI
#   /api/*         → FastAPI
#   /src/*         → FastAPI
#   /healthz       → FastAPI
#   /dashboard/    → KPI     127.0.0.1:8000  (prefix stripped)
#
# Installed as: /etc/nginx/conf.d/application.conf
# (main nginx.conf must include conf.d/*.conf and not conflict on :80/:443)

upstream kiosk_fastapi {
    server 127.0.0.1:8080;
    keepalive 8;
}

upstream kpi_dashboard {
    server 127.0.0.1:8000;
    keepalive 4;
}

# Optional plain HTTP → HTTPS redirect (SG may open :80 for this only).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/tls/application.crt;
    ssl_certificate_key /etc/nginx/tls/application.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Do not cache authenticated API or dynamic app responses.
    add_header Cache-Control "no-store" always;

    # KPI dashboard: require trailing slash so relative fetch("api/kpis") resolves under /dashboard/.
    location = /dashboard {
        return 308 /dashboard/;
    }

    location /dashboard/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        # Strip /dashboard prefix → KPI serves at /
        proxy_pass http://kpi_dashboard/;
        proxy_read_timeout 60s;
    }

    # Everything else (operator UI, kiosk, API, static, healthz) → FastAPI.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        # Preserve cookies / large capture POSTs.
        client_max_body_size 12m;
        proxy_pass http://kiosk_fastapi;
        proxy_read_timeout 120s;
    }
}
